services:
  db:
    image: postgres:18-alpine
    environment: { POSTGRES_DB: people, POSTGRES_USER: people, POSTGRES_PASSWORD: people }
    volumes: ["people-data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U people -d people"], interval: 5s, timeout: 5s, retries: 10 }
  app:
    build: .
    environment: { DATABASE_URL: "postgresql://people:people@db:5432/people", DIRECT_URL: "postgresql://people:people@db:5432/people" }
    ports: ["3000:3000"]
    depends_on: { db: { condition: service_healthy } }
volumes: { people-data: {} }
